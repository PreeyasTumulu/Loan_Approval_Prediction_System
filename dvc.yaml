stages:
  validate:
    cmd: python -m src.validation.schema
    deps:
      - data/raw/loan_train.csv
      - src/ingestion/load_data.py
      - src/validation/schema.py
      - src/utils/config.py
    outs:
      - reports/data_validation.json:
          cache: false

  transform:
    cmd: python -m src.transformation.features
    deps:
      - data/raw/loan_train.csv
      - reports/data_validation.json
      - src/ingestion/load_data.py
      - src/transformation/features.py
      - src/validation/schema.py
      - src/utils/config.py
    outs:
      - data/processed/train.csv
      - data/processed/val.csv
      - data/processed/test.csv
      - data/processed/preprocessor.joblib
